name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean
      api_base_url:
        description: 'Backend API Base URL for Android APK (optional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Web & Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Preinstalled Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDK_MGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDK_MGR" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi

          echo "$(dirname "$SDK_MGR")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDK_MGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MGR" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Web & Server bundle
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || '' }}
        run: bun run build

      - name: Sync Capacitor Android & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Resolve version & package release artifacts
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(date -u +%Y.%m.%d)-r${RUN_NUMBER}"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "Invalid release tag: '$TAG'. Expected format like v1.0.0" >&2
            exit 1
          fi

          ARCHIVE_NAME="ostad-dana-${TAG}.tar.gz"
          APK_NAME="ostad-dana-${TAG}.apk"

          tar -czf "$ARCHIVE_NAME" dist package.json .env.example metadata.json
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

          {
            echo "tag=$TAG"
            echo "archive=$ARCHIVE_NAME"
            echo "apk=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostad-dana-android-apk
          path: ${{ steps.package.outputs.apk }}
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          APK: ${{ steps.package.outputs.apk }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$APK" --clobber
            exit 0
          fi

          FLAGS=(--title "$TAG" --generate-notes)

          if [ "$REF_TYPE" != "tag" ]; then
            FLAGS+=(--target "$TARGET_SHA")
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          elif printf '%s' "$TAG" | grep -Eq -- '-(alpha|beta|rc)'; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" "$ARCHIVE" "$APK" "${FLAGS[@]}"
